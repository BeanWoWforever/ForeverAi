# Builds ForeverAiCompanion.exe on GitHub's own Windows servers, straight from the code in this repo.
# Every release also gets a signed build-provenance record, so anyone can check the .exe came from here:
#   gh attestation verify ForeverAiCompanion.exe --repo <owner>/ForeverAi
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller (the only build dependency; the companion itself uses Python's standard library only)
        run: pip install pyinstaller==6.11.1

      - name: Point the app's "open source" link at this repo
        shell: pwsh
        run: (Get-Content companion/app.py) -replace 'https://github.com/OWNER/ForeverAi', 'https://github.com/${{ github.repository }}' | Set-Content companion/app.py

      - name: Build ForeverAiCompanion.exe
        run: pyinstaller --noconfirm --onefile --windowed --name ForeverAiCompanion --paths companion companion/app.py

      - name: Package the addon
        shell: pwsh
        run: Compress-Archive -Path ForeverAi -DestinationPath ForeverAi-addon.zip

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/ForeverAiCompanion.exe, ForeverAi-addon.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Out-File SHA256SUMS.txt -Encoding ascii

      - name: Build provenance (proves these files were built from this repo by this workflow)
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            dist/ForeverAiCompanion.exe
            ForeverAi-addon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ForeverAi
          path: |
            dist/ForeverAiCompanion.exe
            ForeverAi-addon.zip
            SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ForeverAiCompanion.exe
            ForeverAi-addon.zip
            SHA256SUMS.txt
          generate_release_notes: true
